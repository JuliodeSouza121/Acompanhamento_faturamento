<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a7bec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Meu Plano Financeiro</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1e2a3b;--mut:#6c7a91;--bd:#e7ecf3;--soft:#eef3fb;--ok:#2f9e6b;--warn:#d9911f;--bad:#dd5a6c;--pri:#4a7bec;--pri-soft:#e8effd;--ok-soft:#e5f5ec;--bad-soft:#fdecee;--sh:0 1px 2px rgba(30,42,59,.04),0 6px 20px rgba(30,42,59,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111821;--card:#18212c;--tx:#e8eef6;--mut:#8fa0b6;--bd:#243141;--soft:#1e2937;--ok:#4cc38a;--warn:#f0b354;--bad:#f0788a;--pri:#7ea2ff;--pri-soft:#1f2c47;--ok-soft:#173226;--bad-soft:#3a1f27;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#111821;--card:#18212c;--tx:#e8eef6;--mut:#8fa0b6;--bd:#243141;--soft:#1e2937;--ok:#4cc38a;--warn:#f0b354;--bad:#f0788a;--pri:#7ea2ff;--pri-soft:#1f2c47;--ok-soft:#173226;--bad-soft:#3a1f27;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,Roboto,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:600px;margin:0 auto;padding:6px 16px 160px}
h2{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
#view>.card:first-child .big{font-size:38px;letter-spacing:-.02em;margin:2px 0}
#view>.card:first-child{padding:22px 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;padding:10px 0;display:flex;align-items:center;gap:10px;justify-content:space-between}
header b{font-size:18px;font-weight:650;text-transform:capitalize;flex:1;text-align:center;cursor:pointer}
header button{width:44px;height:44px;font-size:20px;border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -6px 20px rgba(30,42,59,.06);z-index:5}
nav button{flex:1;padding:6px 2px;border:0;border-radius:14px;background:none;color:var(--mut);font-size:11px;font-weight:500;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.3}
nav button.on{color:var(--pri);background:var(--pri-soft);font-weight:650}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(74,123,236,.4);z-index:6}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 4px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child>td,tr:last-child>th{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr[data-act]{cursor:pointer}
input,select,button,textarea{font:inherit;padding:12px 14px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--pri);background:var(--card)}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input[type=number],input[type=text],input:not([type]),select{width:100%}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--pri)}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:100px}
.b{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:600}
.b:active{transform:scale(.98)}
.b.s{background:var(--soft);color:var(--tx)}
.b.d{background:var(--bad);color:#fff}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:6px 10px}
.big{font-size:30px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}.bar i.w{background:var(--warn)}.bar i.r{background:var(--bad)}
.alert{padding:14px;border-radius:16px;background:var(--bad-soft);color:var(--tx);margin:12px 0}
.alert ol{margin:8px 0 0;padding-left:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:0;border-radius:20px;padding:20px 12px;text-align:center;font-size:15px;font-weight:600;cursor:pointer;color:var(--tx);box-shadow:var(--sh)}
.tile span{display:block;font-size:32px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chip{white-space:nowrap;border-radius:20px;padding:8px 14px;background:var(--card);border:0;color:var(--tx);font-size:13px;font-weight:500;box-shadow:var(--sh)}
.chip.on{background:var(--pri);color:#fff}
.scroll{overflow-x:auto}
.done td:first-child+td{text-decoration:line-through;color:var(--mut)}
dialog{border:0;border-radius:24px;padding:20px;width:min(94vw,440px);background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(17,24,33,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><button class="b s" data-act="prev">‹</button><b id="mlabel" data-act="today"></b><button class="b s" data-act="next">›</button></header>
<div id="view"></div>
</main>
<button id="fab" data-act="tx-new" aria-label="Novo gasto">+</button>
<nav id="nav">
<button data-tab="home" class="on"><span>📊</span>Início</button>
<button data-tab="gastos"><span>🧾</span>Gastos</button>
<button data-tab="menus"><span>🧰</span>Menus</button>
<button data-tab="plano"><span>📅</span>Plano</button>
<button data-tab="mais"><span>⚙️</span>Mais</button>
</nav>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
